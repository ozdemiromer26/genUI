# Changesets: with notes in .changeset/, opens (or updates) the "Sürüm" PR;
# when that PR is merged, publishes the package to npm with provenance.
# Publishing needs the NPM_TOKEN secret; without it only the PR is opened.
name: Sürüm

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - uses: changesets/action@v1
        with:
          title: "Sürüm"
          commit: "Sürüm"
          publish: ${{ secrets.NPM_TOKEN != '' && 'pnpm release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
